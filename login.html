<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Entrar · Despesas Mensais</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-caixa { width: 100%; max-width: 380px; padding: 32px; text-align: center; }
        .login-logo { font-size: 34px; margin-bottom: 4px; }
        .login-caixa h1 { font-size: 20px; }
        #erro { color: var(--cor-perigo); font-size: 13px; margin-top: 10px; min-height: 18px; text-align: left; }
        form { text-align: left; }
    </style>
</head>
<body>

<div class="cartao login-caixa">
    <div class="login-logo">💰</div>
    <h1>Despesas Mensais</h1>
    <p class="subtitulo">Entre para continuar</p>

    <form id="form-login">
        <label>E-mail</label>
        <input type="email" id="email" required autocomplete="username" placeholder="voce@email.com">

        <label>Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">

        <div id="erro"></div>

        <button type="submit" class="botao botao-primario">Entrar</button>
    </form>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
