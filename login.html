<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Entrar · Meu Financeiro</title>
    <script src="js/tema-inicial.js"></script>
    <meta name="theme-color" content="#F4F6F9">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/brand/favicon-48.png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="tela-login">

<main class="cartao login-caixa">
    <div class="login-marca">
        <span class="marca marca-grande" role="img" aria-label="Meu Financeiro">
            <span class="marca-simbolo" aria-hidden="true"></span><span class="marca-divisor" aria-hidden="true"></span><span class="marca-nome" aria-hidden="true"><span class="marca-meu">Meu</span><span class="marca-financeiro">Financeiro</span><span class="marca-linha"></span></span>
        </span>
    </div>
    <h1 class="visualmente-oculto">Entrar no Meu Financeiro</h1>
    <p class="login-assinatura">Organização e clareza para acompanhar suas finanças.</p>

    <form id="form-login" novalidate>
        <label for="email" style="margin-top: 0;">E-mail</label>
        <input type="email" id="email" required autocomplete="username" placeholder="voce@email.com" autofocus>

        <label for="senha">Senha</label>
        <div class="campo-com-botao">
            <input type="password" id="senha" required autocomplete="current-password" placeholder="Sua senha">
            <button type="button" class="botao-campo" id="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha"><svg class="icone" aria-hidden="true"><use href="assets/icones.svg#i-olho"></use></svg></button>
        </div>

        <div id="erro" class="mensagem-erro" role="alert" aria-live="assertive"></div>

        <button type="submit" class="botao botao-primario botao-largo">Entrar</button>
    </form>

    <div class="login-rodape">
        <button type="button" class="btn-alternar-tema" title="Trocar o tema de leitura"><svg class="icone" aria-hidden="true"><use href="assets/icones.svg#i-sol"></use></svg><span class="tema-rotulo">Claro</span></button>
    </div>
</main>

<script type="module" src="js/login.js"></script>
<script type="module">
    import { inicializarTema } from "./js/nav.js";
    inicializarTema();
</script>

</body>
</html>
