<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato · Despesas Mensais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-marca">💰 Despesas Mensais</div>
        <nav class="sidebar-links">
            <a href="index.html" data-pagina="lancar"><span class="icone">➕</span><span>Lançar</span></a>
            <a href="importar.html" data-pagina="importar"><span class="icone">📥</span><span>Importar</span></a>
            <a href="extrato.html" data-pagina="extrato"><span class="icone">📋</span><span>Extrato</span></a>
            <a href="dashboard.html" data-pagina="dashboard"><span class="icone">📊</span><span>Dashboard</span></a>
        </nav>
        <div class="sidebar-rodape">
            <div class="sidebar-email"></div>
            <button id="btn-sair" class="botao-sair">🚪 Sair</button>
        </div>
    </aside>

    <main class="conteudo-principal">
        <div class="pagina">
            <h2>Extrato de transações</h2>
            <p class="subtitulo">Mostrando o mês atual por padrão. Ajuste os filtros abaixo para ver outro período.</p>

            <div class="grade-resumo" id="resumo">
                <div class="cartao-metrica metrica-entrada">
                    <div class="rotulo">Entradas</div>
                    <div class="valor" id="total-entradas">R$ 0,00</div>
                </div>
                <div class="cartao-metrica metrica-saida">
                    <div class="rotulo">Saídas</div>
                    <div class="valor" id="total-saidas">R$ 0,00</div>
                </div>
                <div class="cartao-metrica metrica-saldo-pos" id="cartao-saldo">
                    <div class="rotulo">Saldo do período</div>
                    <div class="valor" id="total-saldo">R$ 0,00</div>
                </div>
            </div>

            <div class="cartao">
                <div class="filtros">
                    <div class="campo-filtro">
                        <label>Ano</label>
                        <select id="filtro-ano"></select>
                    </div>
                    <div class="campo-filtro">
                        <label>Mês</label>
                        <select id="filtro-mes">
                            <option value="">Todos</option>
                            <option value="01">Janeiro</option>
                            <option value="02">Fevereiro</option>
                            <option value="03">Março</option>
                            <option value="04">Abril</option>
                            <option value="05">Maio</option>
                            <option value="06">Junho</option>
                            <option value="07">Julho</option>
                            <option value="08">Agosto</option>
                            <option value="09">Setembro</option>
                            <option value="10">Outubro</option>
                            <option value="11">Novembro</option>
                            <option value="12">Dezembro</option>
                        </select>
                    </div>
                    <div class="campo-filtro">
                        <label>Data início</label>
                        <input type="text" id="filtro-data-inicio" placeholder="dd/mm/aaaa">
                    </div>
                    <div class="campo-filtro">
                        <label>Data fim</label>
                        <input type="text" id="filtro-data-fim" placeholder="dd/mm/aaaa">
                    </div>
                    <div class="campo-filtro">
                        <label>Banco</label>
                        <input type="text" id="filtro-banco" placeholder="Todos" list="lista-bancos-filtro">
                        <datalist id="lista-bancos-filtro"></datalist>
                    </div>
                    <div class="campo-filtro">
                        <label>Movimentação</label>
                        <select id="filtro-movimentacao">
                            <option value="">Todas</option>
                            <option value="EXTERNO">Externo</option>
                            <option value="INTERNO">Interno</option>
                        </select>
                    </div>
                    <button id="btn-filtrar" class="botao botao-primario" style="margin:0;width:auto;">Pesquisar</button>
                    <button id="btn-limpar" class="botao botao-secundario">Mês atual</button>
                </div>

                <div class="tabela-scroll">
                    <table id="tabela-transacoes">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Detalhe</th>
                                <th>Movimentação</th>
                                <th>Banco</th>
                                <th>Classificação</th>
                                <th>Valor (R$)</th>
                                <th class="col-acoes">Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module" src="extrato.js"></script>

</body>
</html>
