<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mesma política de segurança da tela Importar, para testar o pdf.js nas mesmas condições. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Teste dos leitores de extrato</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
        pre { background: #f4f4f5; padding: 12px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Teste dos leitores de extrato (sem login, nada é gravado)</h1>
    <p>Ferramenta de desenvolvimento: mostra o que cada leitor entende de um arquivo. Não acessa o Firebase.</p>
    <input type="file" id="arquivos" multiple accept=".csv,.pdf,.png,.jpg,.jpeg,.webp">
    <pre id="saida">Escolha um ou mais arquivos.</pre>
    <script type="module">
        import { lerArquivoExtrato } from "../js/extratos/ler-arquivo.js";
        import { prepararImportacao } from "../js/extratos/conciliacao.js";

        const saida = document.getElementById("saida");
        document.getElementById("arquivos").addEventListener("change", async (e) => {
            const linhas = [];
            const extratos = [];
            for (const arquivo of e.target.files) {
                try {
                    const inicio = performance.now();
                    const r = await lerArquivoExtrato(arquivo, { aoProgredir: (t) => { saida.textContent = t; } });
                    console.log(`[leitores] ${arquivo.name}: ${Math.round(performance.now() - inicio)} ms`);
                    if (r.erro) { linhas.push(`✗ ${arquivo.name}: ${r.erro}`); continue; }
                    extratos.push(r.extrato);
                    const ok = r.extrato.conferencias.every((c) => c.ok);
                    linhas.push(`${ok ? "✓" : "✗"} ${arquivo.name} → ${r.leitor.id}: ${r.extrato.movimentos.length} movimentos${r.extrato.parcelasFuturas?.length ? ` + ${r.extrato.parcelasFuturas.length} parcelas futuras` : ""}; conferências: ${r.extrato.conferencias.map((c) => `${c.rotulo}=${c.ok ? "ok" : "ERRO"}`).join(", ") || "—"}`);
                } catch (erro) {
                    linhas.push(`✗ ${arquivo.name}: ERRO ${erro.message}`);
                    console.error(erro);
                }
            }
            const r = prepararImportacao({ extratos, base: [], hoje: new Date().toISOString().slice(0, 10) });
            linhas.push("", `Titular reconhecido: ${r.titular.nomes.join(" / ") || "—"}`, `Linhas para revisão: ${r.linhas.length}`);
            r.linhas.slice(0, 40).forEach((l) => linhas.push(`  ${l.movimento.banco} ${l.movimento.data} ${l.movimento.tipo} ${l.movimento.valor.toFixed(2)} | ${l.movimento.dataOriginal ?? ""} ${l.movimento.parcela ?? ""} ${l.movimento.contraparte || l.movimento.historico} → ${l.sugestao?.descricao ?? l.motivoStatus} [${l.sugestao?.tipo_mov ?? ""}]`));
            saida.textContent = linhas.join("\n");
            window.__resultadoTeste = linhas.join("\n");
        });
    </script>
</body>
</html>
