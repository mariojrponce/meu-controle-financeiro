<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Lançamento · Meu Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pagina pagina-estreita">
    <h2>Nova transação</h2>
    <p class="subtitulo">Preencha os dados abaixo. Bancos e classificações já usados aparecem como sugestão.</p>

    <div class="cartao">
        <form id="form-transacao">
            <label>Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0.01" required placeholder="0,00">

            <label>Data</label>
            <input type="text" id="data" required placeholder="dd/mm/aaaa">
            <div class="dica-campo">Você pode colar uma data copiada de um extrato — o sistema reconhece o formato sozinho.</div>

            <label>Descrição</label>
            <input type="text" id="descricao" required maxlength="120" placeholder="Ex: Compra no mercado">

            <label>Banco</label>
            <input type="text" id="banco" required maxlength="60" list="lista-bancos" placeholder="Digite para pesquisar...">
            <datalist id="lista-bancos"></datalist>

            <label>Tipo</label>
            <select id="tipo">
                <option value="SAIDA">Saída</option>
                <option value="ENTRADA">Entrada</option>
            </select>

            <label>Movimentação</label>
            <select id="tipo_mov">
                <option value="EXTERNO">Externo (Gasto/Receita real)</option>
                <option value="INTERNO">Interno (Transferência)</option>
            </select>

            <label>Classificação</label>
            <input type="text" id="classificacao_saida" required maxlength="60" list="lista-classificacoes" placeholder="Digite para pesquisar...">
            <datalist id="lista-classificacoes"></datalist>

            <button type="submit" class="botao botao-primario">Salvar transação</button>
        </form>
    </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
